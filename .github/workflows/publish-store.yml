
name: Deploy Neon Store Catalog

on:
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - ".github/workflows/publish-store.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: neon-store-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build app packages and catalog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import zipfile
          import subprocess

          root = pathlib.Path(".")
          apps_dir = root / "apps"
          dist = root / "dist"
          site = root / "site"

          dist.mkdir(exist_ok=True)
          site.mkdir(exist_ok=True)

          catalog = []

          for manifest_path in sorted(apps_dir.glob("*/manifest.json")):
              app_dir = manifest_path.parent

              with manifest_path.open(encoding="utf-8") as f:
                  manifest = json.load(f)

              required = ["schema", "id", "name", "version", "entry"]
              for key in required:
                  if not manifest.get(key):
                      raise ValueError(
                          f"{manifest_path}: missing {key}"
                      )

              if manifest["schema"] != "neonos.app.v1":
                  raise ValueError(
                      f"{manifest_path}: unsupported schema"
                  )

              app_id = manifest["id"]
              version = str(manifest["version"])
              entry = pathlib.PurePosixPath(manifest["entry"])

              if entry.is_absolute() or ".." in entry.parts:
                  raise ValueError(
                      f"{manifest_path}: invalid entry path"
                  )

              if not (app_dir / str(entry)).is_file():
                  raise ValueError(
                      f"{manifest_path}: entry file not found"
                  )

              if any(item["id"] == app_id for item in catalog):
                  raise ValueError(f"Duplicate app ID: {app_id}")

              zip_path = dist / f"{app_id}.zip"

              with zipfile.ZipFile(
                  zip_path, "w", zipfile.ZIP_DEFLATED
              ) as archive:
                  for file in app_dir.rglob("*"):
                      if file.is_file():
                          archive.write(
                              file,
                              file.relative_to(app_dir.parent)
                          )

              tag = f"app-{app_id}-v{version}"
              repo = os.environ["GH_REPO"]

              release_url = (
                  f"https://github.com/{repo}/releases/download/"
                  f"{tag}/{app_id}.zip"
              )

              # Create the release if it doesn't exist.
              result = subprocess.run(
                  ["gh", "release", "view", tag],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL
              )

              if result.returncode == 0:
                  subprocess.run(
                      [
                          "gh", "release", "upload", tag,
                          str(zip_path), "--clobber"
                      ],
                      check=True
                  )
              else:
                  subprocess.run(
                      [
                          "gh", "release", "create", tag,
                          str(zip_path),
                          "--title", f"{manifest['name']} {version}",
                          "--notes", f"NeonOS app release {version}"
                      ],
                      check=True
                  )

              item = {
                  "id": app_id,
                  "name": manifest["name"],
                  "version": version,
                  "description": manifest.get("description", ""),
                  "author": manifest.get("author", ""),
                  "download": release_url,
                  "manifest": manifest
              }

              icon = manifest.get("icon", {})
              if isinstance(icon, dict) and icon.get("src"):
                  icon_path = pathlib.PurePosixPath(icon["src"])
                  if not icon_path.is_absolute() and ".." not in icon_path.parts:
                      item["icon"] = (
                          f"https://raw.githubusercontent.com/{repo}/main/"
                          f"{app_dir.as_posix()}/{icon_path.as_posix()}"
                      )

              catalog.append(item)

          (site / "catalog.json").write_text(
              json.dumps(
                  {
                      "schema": "neonos.store.v1",
                      "apps": catalog
                  },
                  indent=2
              ),
              encoding="utf-8"
          )

          # A simple landing page confirms Pages is working.
          (site / "index.html").write_text(
              "<!doctype html><html><head>"
              "<meta charset='utf-8'>"
              "<title>Neon Store Catalog</title></head>"
              "<body><h1>Neon Store Catalog</h1>"
              "<p>Catalog: <a href='catalog.json'>catalog.json</a></p>"
              "</body></html>",
              encoding="utf-8"
          )

          print(f"Catalog built with {len(catalog)} app(s).")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Neon Store catalog
        id: deployment
        uses: actions/deploy-pages@v4
